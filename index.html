<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La risa malévola del puma</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#310039;color:white;font-family:system-ui,Arial;display:flex;justify-content:center;align-items:center}main{width:min(96vw,575px);text-align:center;padding:12px 0 24px}.stage{position:relative;width:100%;overflow:hidden}.poster{display:block;width:100%;height:auto}#head{position:absolute;left:35%;top:16.4%;width:31%;height:16%;transform-origin:50% 65%;animation:head .42s ease-in-out infinite alternate;pointer-events:none}#mouth{position:absolute;left:29%;top:57%;width:42%;height:34%;border-radius:20% 20% 48% 48%;background:#170b28;border:2px solid #25102f;overflow:hidden;transform:scaleY(.32);transform-origin:top;animation:mouth .42s ease-in-out infinite alternate;box-shadow:0 0 5px #e82ba8}#tongue{position:absolute;left:27%;bottom:3%;width:46%;height:44%;border-radius:50%;background:#f22ca7}#teeth{position:absolute;left:7%;top:0;width:86%;height:28%;background:#fff0c6;clip-path:polygon(0 0,100% 0,88% 100%,75% 0,62% 100%,50% 0,37% 100%,24% 0,12% 100%)}#lower{position:absolute;left:9%;bottom:0;width:82%;height:20%;background:#fff0c6;clip-path:polygon(0 100%,100% 100%,88% 0,73% 100%,60% 0,47% 100%,34% 0,20% 100%,10% 0)}#glow{position:absolute;left:19%;top:30%;width:62%;height:22%;border-radius:50%;background:#20d9e7;filter:blur(13px);opacity:0;animation:glow .42s infinite alternate}button{margin:15px 0 0;padding:12px 20px;border:2px solid #18d5e8;border-radius:999px;background:#e52ba5;color:white;font-weight:800;font-size:1rem;cursor:pointer}p{margin:10px 14px;color:#f4c9f4}.note{font-size:.82rem;color:#d7a9df}@keyframes mouth{from{transform:scaleY(.32)}to{transform:scaleY(1.12)}}@keyframes head{from{transform:translateY(0) rotate(-.4deg)}to{transform:translateY(-3px) rotate(.5deg)}}@keyframes glow{from{opacity:0}to{opacity:.22}}@media(prefers-reduced-motion:reduce){#head,#mouth,#glow{animation:none}}
</style></head><body><main><div class="stage"><img class="poster" src="calaverita.jpg" alt="Puma ilustrado estilo Día de Muertos"><div id="head" aria-hidden="true"><div id="glow"></div><div id="mouth"><div id="teeth"></div><div id="tongue"></div><div id="lower"></div></div></div></div><button id="btn">🔊 Reproducir risa malévola</button><p>¡JA… JA… JA…! 😈</p><p class="note">Pulsa el botón para escuchar el efecto de risa caricaturesca.</p></main><script>
let ctx;function laugh(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){alert("Este navegador no admite el efecto de audio.");return}ctx=ctx||new AC();if(ctx.state==="suspended")ctx.resume();const s=ctx.currentTime;for(let i=0;i<6;i++){let t=s+i*.24,o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=i%2?"triangle":"sawtooth";o.frequency.setValueAtTime(190-i*8,t);o.frequency.exponentialRampToValueAtTime(90+(i%2)*15,t+.15);f.type="lowpass";f.frequency.value=950;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(f);f.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.2)}}document.getElementById("btn").addEventListener("click",laugh);
</script></body></html>
