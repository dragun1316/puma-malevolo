<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puma — Risa malévola</title>
  <style>
    :root { color-scheme: dark; --bg:#170b25; --panel:#241039; --cyan:#00e6ef; --pink:#ff28b9; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      color:#fff; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      background:radial-gradient(circle at 20% 20%,rgba(255,40,185,.18),transparent 35%),
                 radial-gradient(circle at 80% 75%,rgba(0,230,239,.15),transparent 35%),var(--bg);
    }
    main {
      width:min(920px,100%); text-align:center; padding:clamp(18px,4vw,34px);
      border:1px solid rgba(0,230,239,.35); border-radius:22px; background:rgba(36,16,57,.88);
      box-shadow:0 0 38px rgba(255,40,185,.12),0 0 60px rgba(0,230,239,.08);
    }
    h1 { margin:0 0 8px; letter-spacing:.04em; text-transform:uppercase; font-size:clamp(1.5rem,4vw,2.6rem); text-shadow:0 0 18px rgba(255,40,185,.65); }
    p { color:#d8cce6; margin:0 0 22px; }
    .art { display:block; width:min(100%,560px); max-height:72vh; object-fit:contain; margin:0 auto; border-radius:12px; box-shadow:0 0 24px rgba(0,230,239,.18); }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:22px; }
    a,button { border:0; border-radius:999px; padding:12px 18px; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; color:#170b25; background:linear-gradient(100deg,var(--cyan),#8df7dd); }
    button { color:white; background:linear-gradient(100deg,#a72591,var(--pink)); }
    footer { margin-top:18px; font-size:.85rem; color:#a995bb; }
  </style>
</head>
<body>
  <main>
    <h1>La risa malévola del puma</h1>
    <p>Una carcajada neón en bucle. 😈🐆</p>
    <img class="art" src="puma_risa_malevola_ultra.gif" alt="Puma riendo malévolamente en una animación GIF">
    <div class="actions">
      <a href="puma_risa_malevola_ultra.gif" download>Descargar GIF</a>
      <button type="button" id="toggle">Pausar animación</button>
    </div>
    <footer>Coloca este archivo HTML y el GIF en la misma carpeta para que funcione sin internet.</footer>
  </main>
  <script>
    const img = document.querySelector(".art");
    const button = document.querySelector("#toggle");
    let paused = false;
    let frozenFrame = null;
    button.addEventListener("click", () => {
      if (!paused) {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);
        frozenFrame = canvas.toDataURL("image/png");
        img.src = frozenFrame;
        button.textContent = "Reanudar animación";
      } else {
        img.src = "puma_risa_malevola_ultra.gif?replay=" + Date.now();
        button.textContent = "Pausar animación";
      }
      paused = !paused;
    });
  </script>
</body>
</html>
